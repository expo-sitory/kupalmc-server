# LEAGUE MECHANICS CONFIGURATION
# https://github.com/expo-sitory

debug: true

runes:
  keystones:

    # ============================= #
    #        DOMINATION PATH        #
    # ============================= #

    domination:

      dark-harvest:
        base-adaptive-damage-per-stack: 0.2
        level-cost-per-stack: 5
        cooldown: 60

      electrocute:
        base-adaptive-damage: 7.5
        cooldown: 25

      hail-of-blades:
        base-attack-speed: 0.10 # percentage
        base-true-damage: 0.7 # percentage
        ad-percentage-multiplier: 0.8
        ap-percentage-multiplier: 0.6
        cooldown: 60


    # ============================= #
    #       PRECISION PATH          #
    # ============================= #

    precision:
      conqueror:
        base-adaptive-damage-per-stack: 0.5

      fleet-footwork:
        maximum-stacks: 100
        blocks-per-stack: 10.0
        projectile-stack-gain: 5
        heal-percent: 0.25
        ad-percentage-multiplier: 0.10 # bonus healing percentage from total AD percent
        ap-percentage-multiplier: 0.05 # bonus healing percentage from total AP percent

      lethal-tempo:
        cooldown: 30
        attack-speed: 0.6 # when on max stacks/active state
        base-adaptive-damage: 0.7


      press-the-attack:
        cooldown: 6
        base-adaptive-damage: 2.5


    # ============================= #
    #       INSPIRATION PATH        #
    # ============================= #

    inspiration:

      glacial-augment:
        base-freeze-duration: 120 # in ticks
        ad-percentage-multiplier: 0.07 # bonus freeze duration from total AD percent
        ap-percentage-multiplier: 0.06 # bbonus freeze duration from total AP percent
        cooldown: 45

      first-strike:
        cooldown: 25 # seconds
        initial-xp: 10.0 # starting xp
        buff-duration: 3 #seconds
        true-damage-percent: 0.07 # while on active state
        ad-percentage: 0.20 # bonus true damage from total AD percent
        ap-percentage: 0.15 # bonus true damage from total AP percent


    # ============================= #
    #       RESOLVE PATH            #
    # ============================= #

    resolve:

      aftershock:
        cooldown: 45
        effect-duration: 300
        absorption-level: 2
        resistance-level: 2


      grasp-of-the-undying:
        cooldown: 45
        damage-percent: 0.08
        heal-percent: 0.15


      guardian:
        max-players: 5
        absorption-line: 2.0 # lines of absorption hearts
        cooldown: 60


    # ============================= #
    #       SORCERY PATH            #
    # ============================= #

    sorcery:

      arcane-comet:
        cooldown: 20
        base-adaptive-damage: 6.0
        ad-percentage-multiplier: 0.05
        ap-percentage-multiplier: 0.15

      deathfire-torch:
        damage-ticks: 20 # 20 ticks apart per damage
        ad-percentage-multiplier: 0.02 # bonus magic damage from total AD percent
        ap-percentage-multiplier: 0.03 # bonus magic damage from total AP percent

      storm-raider-surge:
        cooldown: 25
        damage-percent-threshold: 0.30 # bonus duration from total AD percent
        movement-speed-bonus: 0.40 # bonus duration from total AP percent

