# LEAGUE MECHANICS CONFIGURATION
# https://github.com/expo-sitory

# ================================== #
#              RUNES                 #
# ================================== #

# CONVERSION:
# Converted Damage = The AD and AP damage conveted to 1 is to 0.5 (1 AD/ 1AP = 0.5 Heart)
# Event Damage = The damage of the player, this includes weapon/weapon w enchant, strength pots

# DAMAGE OUTPUT FORMULA FOR PER-STACK-BASED OUTPUT RUNES:
# totalAbilityPower = BASE-AP + (STACKS * AP-PER-STACKS)
# totalAttackDamage = BASE-AD + (STACKS * AD-PER-STACKS)
# ConvertedDamage = (totalAbilityPower + totalAttackDamage) / 2
# totalBonusDamage = (PlayerArmor + PlayerMagicResist) - ConvertedDamage
# totalOutput = EventDamage + totalBonusDamage

# DAMAGE OUTPUT FORMULA FOR NON-PER-STACK-BASED & LEVEL-BASED BONUS DAMAGE RUNES:
# BONUS-AP = IF LEVEL 0-29: 1.5, IF LEVEL 30-49: 2.0, IF LEVEL 50-69: 2.5, IF LEVEL 70-99+: 3.0, IF LEVEL 100+: 3.5
# BONUS-AD = IF LEVEL 0-29: 1.5, IF LEVEL 30-49: 2.5, IF LEVEL 50-69: 3.5, IF LEVEL 70-99+: 4.5, IF LEVEL 100+: 5.5
# totalAbilityPower = Player-AP + (BASE-AP + BONUS-AP)
# totalAttackDamage = Player-AD + (BASE-AD + BONUS-AD)
# ConvertedDamage = (totalAbilityPower + totalAttackDamage) / 2
# totalBonusDamage (PlayerArnor + PlayerMagicResist) - ConvertedDamage
# totalOutput = EventDamage + totalBonusDamage

runes:
  keystones:

    # ============================= #
    #        DOMINATION PATH        #
    # ============================= #
    domination:

      dark-harvest:
        attack-damage-per-stack: 2.5
        maximum-stacks: 20
        level-cost-per-stack: 5
        cooldown: 60

      electrocute:
        base-physical-damage: 3.5
        maximum-stacks: 3
        cooldown: 25

      hail-of-blades:
        attack-speed-bonus: 0.10
        true-damage-multiplier: 0.20
        cooldown: 60


    # ============================= #
    #       PRECISION PATH          #
    # ============================= #
    precision:

      conqueror:
        attack-damage-per-stack: 2.5
        maximum-stacks: 12

      fleet-footwork:
        maximum-stacks: 100
        blocks-per-stack: 10.0
        projectile-stack-gain: 5
        heal-percent: 0.60

      lethal-tempo:
        maximum-stacks: 6
        attack-speed-bonus: 0.80
        cooldown: 30

      press-the-attack:
        base-physical-damage: 4.5
        cooldown: 30


    # ============================= #
    #       INSPIRATION PATH        #
    # ============================= #
    inspiration:

      glacial-augment:
        damage-reduction: -0.20
        cooldown: 45


    # ============================= #
    #       RESOLVE PATH            #
    # ============================= #
    resolve:

      aftershock:
        effect-duration: 300
        absorption-level: 2
        resistance-level: 2
        cooldown: 45

      grasp-of-the-undying:
        maximum-stacks: 4
        damage-percent: 0.05
        heal-percent: 0.15
        cooldown: 45

      guardian:
        max-players: 5
        absorption-percentage: 0.80
        cooldown: 60


    # ============================= #
    #       SORCERY PATH            #
    # ============================= #
    sorcery:

      arcane-comet:
        base-magic-damage: 20.5
        cooldown: 20

      deathfire-torch:
        base-magic-damage: 10.5

      storm-raider-surge:
        damage-threshold: 0.80
        movement-speed-bonus: 0.40
        cooldown: 25
