# ================================== #
#              RUNES                 #
# ================================== #


runes:
  keystones:

    # ============================= #
    #        DOMINATION PATH        #
    # ============================= #
    domination:

      dark-harvest:
        base-adaptive-damage-per-stack: 2.5
        level-cost-per-stack: 5
        cooldown: 60

      electrocute:
        base-adaptive-damage: 25.15
        cooldown: 25

      hail-of-blades:
        base-attack-speed: 0.10
        base-true-damage: 1.25
        ad-percentage-multiplier: 0.8
        ap-percentage-multiplier: 0.6
        cooldown: 60


    # ============================= #
    #       PRECISION PATH          #
    # ============================= #
    precision:
      conqueror:
        base-adaptive-damage-per-stack: 2.5

      fleet-footwork:
        maximum-stacks: 100
        blocks-per-stack: 10.0
        projectile-stack-gain: 5
        heal-percent: 0.25
        ad-percentage-multiplier: 0.10
        ap-percentage-multiplier: 0.05

      lethal-tempo:
        cooldown: 30
        attack-speed: 0.6 # when on max stacks/active state
        base-adaptive-damage: 4.5


      press-the-attack:
        cooldown: 6
        base-adaptive-damage: 4.5


    # ============================= #
    #       INSPIRATION PATH        #
    # ============================= #
    inspiration:

      glacial-augment:
        base-freeze-duration: 120 # in ticks
        ad-percentage-multiplier: 0.07
        ap-percentage-multiplier: 0.06
        cooldown: 45

      first-strike:
        cooldown: 25 # seconds
        initial-xp: 10.0
        buff-duration: 3 #seconds
        true-damage-percent: 0.07
        combat-window-ms: 250
        ad-percentage: 0.20
        ap-percentage: 0.15


    # ============================= #
    #       RESOLVE PATH            #
    # ============================= #
    resolve:

      aftershock:
        cooldown: 45
        effect-duration: 300
        absorption-level: 2
        resistance-level: 2


      grasp-of-the-undying:
        cooldown: 45
        damage-percent: 0.08
        heal-percent: 0.15


      guardian:
        max-players: 5
        absorption-percentage: 0.80
        cooldown: 60


    # ============================= #
    #       SORCERY PATH            #
    # ============================= #
    sorcery:

      arcane-comet:
        cooldown: 20
        base-adaptive-damage: 20.5
        ad-percentage-multiplier: 0.05
        ap-percentage-multiplier: 0.15

      deathfire-torch:
        base-magic-damage: 10.5
        ad-percentage-multiplier: 0.05
        ap-percentage-multiplier: 0.10

      storm-raider-surge:
        cooldown: 25
        damage-percent-threshold: 0.30 # percentage
        movement-speed-bonus: 0.40 # percentage

